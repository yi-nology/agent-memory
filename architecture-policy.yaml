# agent-memory 架构治理策略
#
# 双面设计：本文件既是「声明面」（模块清单 + 依赖方向 + 域词红线，供人阅读与
# AI 对齐），也是「可执行面」（rules 段由 tools/archcheck 逐条执行，
# `make architecture-check` 门禁；违反即非零退出）。正则一律 RE2 语法。
#
# ── 与 agent-harness 的分工 ──
# harness 管「编排内核不得长出领域知识」+「harness 内部依赖方向」；
# 本仓管「记忆内核不得长出领域知识」+「记忆内部依赖方向」+「两者不得互相 import」。
# 三面合起来才是完整红线：拆分后最怕的就是半年后业务代码慢慢渗回内核。
#
# 纪律：
#   - 提交前跑 `make check`；
#   - **policy 先行**：新依赖方向先改本文件再写代码；
#   - 新模块登记 {id, roots, requires}；
#   - 例外必须带注释说明原因与拆除条件（当前 exceptions 为空）。

version: 1

# ── 模块清单（requires = 允许的内部依赖方向）──
# 未落地的模块先登记在此：policy 先行的意义就是「方向先钉死，代码后跟上」，
# 否则实现时会顺手 import 一个当时看着方便、事后没人查得清的包。
modules:
  - id: types
    roots: [types]
    requires: []
    owner: memory
    managed: true
    notes: |
      领域结构单源：捕获事件/候选/事实卡/实体/页面/树/情节/审计条目。
      零内部依赖、零第三方依赖——它是整个仓的地基，地基一动全塌。

  - id: ports
    roots: [ports]
    requires: []
    owner: memory
    managed: true
    notes: |
      外部能力接口面：模型调用、向量化、向量索引。
      只声明协议，不含实现、不引任何 SDK。「装了包不等于配好了模型」是显式立场：
      没注入模型时提炼类动作必须**报错**而非静默产出幻觉。

  - id: store
    roots: [store]
    requires: [types]
    owner: memory
    managed: true
    notes: |
      持久化契约。按消费面拆成小接口（RawStore/AtomStore/...），
      阶段只持自己那一小片——「阶段能碰哪些表」在类型上可见。
      namespace 显式传参，不在构造时绑定。

  - id: storage-parity
    roots: [storage/parity]
    requires: [types, store]
    owner: memory
    managed: true
    notes: |
      跨后端共享行为断言。它本身不实现存储，只定义「记忆库该有什么行为」。
      放在仓内而不是仓外，是为了让两个后端都**必须**接到同一份断言上——
      断言与被断言者同仓，改断言时改不动实现的诱惑小得多。

  - id: storage-sqlite
    roots: [storage/sqlite]
    requires: [types, store, storage-parity]
    owner: memory
    managed: true
    notes: 纯 Go SQLite 驱动（FTS5 + 表前缀隔离 namespace）。方言 SQL 只许出现在本目录。

  - id: storage-postgres
    roots: [storage/postgres]
    requires: [types, store, storage-parity]
    owner: memory
    managed: true
    notes: PostgreSQL 后端（namespace-first 键 + 全文检索）。与 sqlite 必须同一组行为断言。

  - id: pipeline-capture
    roots: [pipeline/capture]
    requires: [types, ports, store]
    owner: memory
    managed: true
    notes: 事件 → RawEvent。**脱敏接线点在此**（落库前，不是注入前——落库后再打等于已泄漏）。

  - id: pipeline-extractor
    roots: [pipeline/extractor]
    requires: [types, ports, store]
    owner: memory
    managed: true
    notes: RawEvent → Candidate。抽取要调模型（贵、慢、会幻觉），故与判定分层。

  - id: pipeline-promotion
    roots: [pipeline/promotion]
    requires: [types, ports, store]
    owner: memory
    managed: true
    notes: 候选判定五检查（价值/证据/实体归一/重复/矛盾）→ 晋升·并入·丢弃·送人工。

  - id: pipeline-recall
    roots: [pipeline/recall]
    requires: [types, ports, store]
    owner: memory
    managed: true
    notes: 召回全链（路由/多源/重排/去冗/抑制/预算/活跃实体栈/缓存/超时）+ 注入防伪。

  - id: pipeline-entity
    roots: [pipeline/entity]
    requires: [types, store]
    owner: memory
    managed: true
    notes: |
      归一面：把同一个对象的不同叫法收敛到一张实体卡上。
      宿主认识自己的对象标识，内核不认识——故本包只提供**机制**
      （按名查、登记别名、合并实体），词表与判定标准归宿主。

  - id: pipeline-page
    roots: [pipeline/page]
    requires: [types, ports, store]
    owner: memory
    managed: true
    notes: 实体页面脏标记与重生成。页面是派生物，事实卡才是真源。

  - id: pipeline-episode
    roots: [pipeline/episode]
    requires: [types, ports, store]
    owner: memory
    managed: true
    notes: 情节摘要与日/周/月周期摘要。与事实卡是两条独立的路，互不依赖。

  - id: lifecycle
    roots: [lifecycle]
    requires: [types, ports, store, pipeline-extractor, pipeline-promotion, pipeline-recall, pipeline-page, pipeline-episode, pipeline-entity, storage-sqlite]
    owner: memory
    managed: true
    notes: 回收/合并/清真/保留期。事实卡只软退役不硬删——被推翻的事实曾经是真的。

  - id: operations
    roots: [operations]
    requires: [types, store, operations-portable, storage-sqlite]
    owner: memory
    managed: true
    notes: |
      导入/导出与跨宿主迁移包（.hmpkg，zip 容器 + JSONL + 校验和清单）。
      三条闭环：pack / adopt / doctor。doctor 存在的原因是迁移是最容易出
      静默错误的环节——包缺一半，导入「成功」了，而宿主从此拥有一段残缺的记忆，
      而记忆库不会告诉你它缺了什么。

  - id: operations-portable
    roots: [operations/portable]
    requires: [types, store, storage-sqlite]
    owner: memory
    managed: true
    notes: 迁移包的具体格式与三条闭环（pack/adopt/doctor）。

  - id: adapters-cli
    roots: [adapters/cli]
    requires: [application, operations-portable, storage-sqlite, ports, types, store, pipeline-capture, pipeline-recall, pipeline-entity, lifecycle]
    owner: memory
    managed: true
    notes: |
      命令行面。`Run(args, stdout, stderr) int` 而非 `main()`——命令逻辑因此
      可被单测直接调用，不用起子进程。CLI **不注入模型**：它是管理口
      （看与搬），不是生成口。
      requires 里的 pipeline-entity 与 lifecycle 是库管理面的依赖：
      实体归一的修正（合并 / 登记别名）与生命周期四动作（回收 / 合并 /
      保留期 / 物理整理）在内核里实现了却没有入口时，既不会被用也不会被验证。

  - id: cmd-memory
    roots: [cmd]
    requires: [adapters-cli]
    owner: memory
    managed: true
    notes: 二进制入口的薄壳。

  - id: application
    roots: [application]
    requires: [types, ports, store, pipeline-capture, pipeline-extractor, pipeline-promotion, pipeline-recall, pipeline-page, pipeline-episode, lifecycle, operations]
    owner: memory
    managed: true
    notes: 宿主装配面：配置、运行时、路径投影、宿主手改文件对账。

  - id: adapters-bridge
    roots: [adapters/bridge]
    requires: [application, types, store, ports, pipeline-recall, pipeline-capture,
               pipeline-page, pipeline-episode, storage-sqlite]
    owner: memory
    managed: true
    notes: |
      JSON-RPC over stdio。跨语言/独立进程宿主的入口。

      pipeline-page 与 pipeline-episode 是**库管理面**：页面重生成、情节抽取与
      周期摘要都需要模型，而服务面刻意不装它们（见 application 的包注释）。
      它们挂在 bridge 上，是因为 bridge 才是「宿主不必是 Go」时唯一能触达的口子——
      能力实现了却没有入口，既不会被用也不会被验证。

  - id: integration
    roots: [integration]
    requires: [types, ports, store, pipeline-capture, pipeline-extractor, pipeline-promotion,
               pipeline-recall, pipeline-entity, pipeline-page, pipeline-episode,
               lifecycle, operations, operations-portable, application,
               storage-sqlite, storage-parity]
    owner: memory
    managed: true
    notes: |
      跨包端到端测试的**专属位置**。

      为什么要单列一个模块：架构门禁的依赖方向规则对 `_test.go` 同样生效，
      而端到端用例天生要跨好几层（捕获 → 提炼 → 晋升 → 页面 → 情节 → 召回 → 迁移）。
      没有这个位置时，那些用例要么写不进任何包（撞方向规则），
      要么被塞进某个流水线包并顺手放宽它的 requires——
      而「为了塞下一个测试而放宽生产包的依赖方向」是门禁最容易被绕过的一种方式。

      故给它一块专门的 roots，并在这里放开全部需要的方向：
      方向规则仍然对它生效（它不许反向依赖宿主与编排），
      但它**可以**正当地把各层放在一起看。

      它的价值是「接缝」：每条流水线各自单测都绿，
      而主链在最后一环断掉（晋升不落库）这类缺陷，
      只有走完整条链的用例才抓得到。

# ── 规则段（由 tools/archcheck 逐条执行）──
rules:
  - id: memory-no-domain-vocabulary
    desc: |
      记忆内核不得长出领域知识。本仓认识「事实/实体/会话」，不认识「主机/集群/Pod」。
      注释与测试数据同样计入——只扫 import 图和标识符的检查会被注释里的
      领域词表绕过去，而那正是最常见的渗入路径。
    severity: error
    scope: ["."]
    scope_exclude: [".gomodcache-mavis", ".gocache-mavis", "tools", "docs"]
    ignore_test: false
    forbid_regex:
      # 中文域词：运维对象与运维流程。逐词挑选，不写「节点」——
      # 树节点（MemoryNode）是本仓的正统概念，写进去会逼着人绕过门禁。
      - '(主机|集群|巡检|诊断链|故障链|运维|专家包|知识库)'
      # 英文域词：只收 k8s 与集群语义的确定形态。
      - '\b(kubernetes|k8s|kubectl|kubeconfig|pods?|clusters?)\b'

  - id: memory-vocabulary-false-positive-guard
    desc: |
      禁词表**刻意不含**四个与领域同形、但确属本仓正统概念的词——
      首轮实跑正是被它们打红的（误报 2 处），现记在这里防复发：
        - host / 「主机」以外的用法：产出方标识（哪个宿主产生了这条记忆）；
        - namespace / **「命名空间」**：记忆隔离维度（store.Namespace），
          不是 k8s namespace。中文形式尤其危险——同一个词两种含义，
          英文能被 \b 词边界救回来，中文没有边界，只能靠人判；
        - node / 「节点」：记忆树节点（MemoryNode），不是集群节点。
      k8s 侧的 namespace 不靠禁词抓，靠 kubernetes/k8s/kubectl 这几个
      必现的伴生词——见到 namespace 且同文件有 k8s 词，k8s 词先红。
      ⚠️ 已知限制（首轮实跑撞到，写在这里免得后人以为是 bug）：本门禁是纯文本匹配，
      **连「解释禁词的那行注释」都会拦**。因此禁用词不能出现在任何文本里，
      包括解释它的那一行。要写这类说明，只能说「本仓没有的某类基础设施对象」，
      不能逐字复述词表。
      另一条已知限制：中文没有词边界，同形不同义只能靠人判（见上面「命名空间」）。

      本条不是检测规则，是**给改门禁的人的警示**：看到这三个词不要"顺手补进禁词表"——
      门禁一旦有假红，团队就会开始用 nolint 绕它，而绕过的门禁等于没有门禁。
      （判据：误命中方向决定代价。这三个词加进去会立刻产生假红，而它们指的东西
      在本仓是承重的。）

  - id: memory-no-harness-dependency
    desc: |
      agent-memory 与 agent-harness 是**平级内核**，不是父子。
      记忆不得 import 编排（harness）；编排也不得 import 记忆——记忆是宿主可选装的。
      两侧要交换的东西走宿主：编排把事件喂进来，宿主把召回结果取走。
    severity: error
    scope: ["."]
    scope_exclude: [".gomodcache-mavis", ".gocache-mavis", "tools", "docs"]
    ignore_test: false
    forbid_import_regex: '^github\.com/yi-nology/agent-harness(/|$)'

  - id: memory-store-single-source
    desc: |
      方言 SQL 只许出现在 storage/ 下。pipeline 层出现 SQL 即为越界：
      换后端时 SQL 会跟着漏出去，而漏出去的那几处永远没人记得回来改。
    severity: error
    scope: ["types", "ports", "store", "pipeline", "lifecycle", "operations", "application", "adapters"]
    ignore_test: false
    forbid_regex: ['(?i)\b(SELECT\s+.*\s+FROM|INSERT\s+INTO|UPDATE\s+\w+\s+SET|DELETE\s+FROM|CREATE\s+TABLE)\b']

  # 核心零依赖：这是「零核心依赖」纪律的执行面。
  #
  # 只查 go.mod 的 require 段是不够的——require 是整个模块的账，而本仓的纪律
  # 是「核心零依赖、第三方只许出现在存储层」，两种纪律在同一份 go.mod 里并存
  # 是可接受的。判据必须落在 **import 面**上：谁真的引了它。
  #
  # ── 受控开口：allow_third_party ──
  #
  # 这条纪律不是「第三方一律不许进核心」，而是「第三方进核心必须逐条登记
  # 理由与到期日」。理由是原纪律的出发点只关心**SDK 那一类**：模型 SDK、
  # embedding SDK、HTTP 框架、数据库驱动——它们会把「没配模型时手工写入 +
  # 词法召回必须能跑」这条降级路径拆掉。
  #
  # 而「纯 stdlib 的工具级模块」不破坏这条路径：它们不引模型、不联网、
  # 不碰数据库，只把各仓都要重写一遍的轮子收进一处。故对这类模块开一个
  # **受控开口**：默认仍然只许 stdlib 与本仓，每一条放行都必须写明
  # 「放行什么 / 为什么 / 复核到哪天 / 什么条件下拆掉」，缺一条加载即失败。
  #
  # 门禁侧（tools/archcheck）：
  #   - 路径匹配卡在路径分隔符上：pkg 不会顺带放行 pkg-evil；
  #   - 到期即红（memory-allowlist-expired）：到期不豁免，例外不许无限期挂着。
  - id: memory-core-stdlib-only
    desc: |
      types / ports / store / pipeline / lifecycle / operations / application / adapters
      只准 import 标准库与本仓。第三方包（LLM SDK、embedding SDK、HTTP 框架、
      数据库驱动）只许出现在 storage/ 下。

      理由不是洁癖，是**降级路径**：没有模型时手工写入 + 词法召回必须能跑，
      没有数据库时领域模型必须能编译。核心一旦引了 SDK，这条路径就没了——
      而它塌了之后不会立刻暴露，它塌在「用户配了模型、装了数据库」的生产环境里。

      受控开口：allow_third_party 段逐条登记的纯 stdlib 工具级模块可进核心。
      每条带 reason + until + removal，缺一条门禁在加载期就失败。
    severity: error
    scope: ["types", "ports", "store", "pipeline", "lifecycle", "operations", "application", "adapters"]
    ignore_test: false
    forbid_third_party_in: ["types", "ports", "store", "pipeline", "lifecycle", "operations", "application", "adapters"]
    allow_third_party:
      - path: github.com/oekit/pkg
        reason: |
          纯 stdlib 微工具集（go.mod require 段为空，不引任何第三方）。
          本仓用到三处：时间段的期初边界（timex，替掉手写的日/周/月墙钟算术）、
          泛型集合（container，替掉两处重复的保序去重与两处手写已见集合）、
          摘要入口（encoding，替掉两处手写 sha256+hex）。
          三者都是「各仓都要重写一遍」且**边界易错**（大小月、闰年、周起始日）
          的轮子，自研副本的漂移成本高于引用成本。
        until: 2027-10-19
        removal: |
          该模块停更、出现不可接受的破坏性变更，或本仓自研出等价实现且
          引用点回落到零时移除本条并回填自研实现。

      - path: github.com/oagentkit/textx
        reason: |
          纯 stdlib（仅依赖 oekit/pkg）。用到 textutil 的代码围栏剥离：
          模型输出常带 ``` 围栏，本仓在提炼面与页面重生成面各手写了一份，
          而围栏形态（语言标记、闭合缺失、散文夹带）边界多。
        until: 2027-10-19
        removal: |
          该模块停更，或本仓两处围栏处理都改走别的单源时移除。

      - path: github.com/oagentkit/guardx/logredact
        reason: |
          凭据脱敏规则表，**单包 import 面纯 stdlib**（只用 regexp/strings/sort/sync）。
          本仓自研兵底漏四类形态：Authorization 头、裸 Bearer、裸 JWT、
          截断在中段的私钥块——而凭据一旦落库即不可逆（收录标准第三条），
          漏报的代价是轮换都来不及。该包是上游单源，抄一份会立刻变成双源漂移。
        until: 2027-10-19
        removal: |
          上游提供可组合/可扩展的规则表（见已提 issue）后改用组合式接入，
          或本仓自研补齐那四类形态。
        paths: ["ports"]

thresholds:
  max_file_lines: 800
  max_methods_per_type: 60
  scan_roots: ["types", "ports", "store", "pipeline", "storage", "lifecycle", "operations", "application", "adapters"]
  enforce: true
  notes: |
    max_file_lines 是拆分信号不是风格偏好：本仓的经验是文件长到某个程度，
    就会有人把「两件事」塞进同一个文件而只改一半。god object 阈值沿用 harness 的 60。

exceptions: []

